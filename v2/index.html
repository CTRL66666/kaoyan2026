<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>26考研全能作战系统</title>
  <script>
    // 【2026-08-31 用户需求】首加载可视化：自包含启动屏（不依赖任何待下载资源，
    // HTML 一到就渲染）。进度来源＝PerformanceObserver 追踪 /assets/ 关键资源完成数
    // （阶梯推进 + 平滑动画），应用挂载完成后由 main.ts 置 __APP_READY 触发淡出。
    (function () {
      var done = false;
      var tips = [
        '正在唤醒作战系统…',
        '排程 / 错题本 / AI 教练整装待发',
        '你的复习数据正在本地装载',
        '提示：添加到主屏幕，可离线使用',
        '提示：AI 出题会自动验算答案',
        '深色模式跟随系统，夜间刷题不刺眼',
        '慢一点没关系，稳住节奏就是赢',
        '今天也在为上岸后的那个自己加油'
      ];
      var step = 0, pct = 6, target = 6;
      // 资源完成 → 阶梯推进（entry/vendor/css 约三四件，完成一件推一档）
      function watch() {
        try {
          var n = performance.getEntriesByType('resource')
            .filter(function (e) { return /\/assets\/.+\.(js|css)/.test(e.name); }).length;
          if (n > step) { step = n; target = Math.min(92, 18 + n * 20); }
        } catch (e) {}
      }
      function tick() {
        if (done) return;
        watch();
        if (pct < target) pct = Math.min(target, pct + Math.max(0.6, (target - pct) * 0.06));
        var bar = document.getElementById('boot-bar');
        var num = document.getElementById('boot-num');
        if (bar) bar.style.width = pct.toFixed(1) + '%';
        if (num) num.textContent = Math.round(pct) + '%';
        requestAnimationFrame(tick);
      }
      function ready() {
        if (done) return;
        done = true;
        var bar = document.getElementById('boot-bar');
        if (bar) bar.style.width = '100%';
        var num = document.getElementById('boot-num');
        if (num) num.textContent = '100%';
        setTimeout(function () {
          var s = document.getElementById('boot-splash');
          if (s) { s.style.opacity = '0'; s.style.transition = 'opacity .35s'; }
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 400);
        }, 180);
      }
      window.__BOOT_READY = ready;
      // 主应用挂载失败兜底：8s 后提示换浏览器（原有提示升级为样式化卡片）
      setTimeout(function () {
        if (done) return;
        var t = document.getElementById('boot-tip');
        if (t) t.textContent = '加载较慢，请检查网络；若长时间停留，请用 Chrome / Edge 打开';
      }, 8000);
      // 每 2.2s 轮换等待文案
      var ti = 0;
      setInterval(function () {
        if (done) { clearInterval(this); return; }
        ti = (ti + 1) % tips.length;
        var t = document.getElementById('boot-tip');
        if (t) t.textContent = tips[ti];
      }, 2200);
      // 首屏渲染后立刻启动（DOM 就绪即可，无需等任何资源）
      var start = function () {
        var t = document.getElementById('boot-tip');
        if (t) t.textContent = tips[0];
        requestAnimationFrame(tick);
        try {
          new PerformanceObserver(watch).observe({ type: 'resource', buffered: true });
        } catch (e) {}
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
  <style>
    /* 启动屏：全部内联（HTML 一到即渲染，白屏时间为 0）；亮/暗自适应 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #f7f8fa 0%, #eef1f6 100%);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      transition: opacity .35s;
    }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: linear-gradient(160deg, #14171c 0%, #1b2027 100%); }
      #boot-splash .boot-card { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); }
      #boot-splash .boot-title { color: #e8eaed; }
      #boot-splash .boot-tip, #boot-splash .boot-num { color: #9aa3ad; }
      #boot-splash .boot-track { background: rgba(255,255,255,.12); }
    }
    .boot-card {
      width: min(420px, 86vw); padding: 34px 30px 26px; text-align: center;
      background: rgba(255,255,255,.75); border: 1px solid rgba(0,0,0,.06);
      border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .boot-logo { font-size: 40px; line-height: 1; margin-bottom: 10px; }
    .boot-title { font-size: 17px; font-weight: 700; color: #1f2329; letter-spacing: .5px; }
    .boot-track {
      height: 8px; border-radius: 999px; background: rgba(0,0,0,.08);
      overflow: hidden; margin: 18px 0 8px;
    }
    .boot-bar {
      height: 100%; width: 6%; border-radius: 999px;
      background: linear-gradient(90deg, #2f54eb, #69a1ff);
      transition: width .25s ease-out;
    }
    .boot-num { font-size: 12px; color: #7a828c; font-variant-numeric: tabular-nums; }
    .boot-tip { font-size: 12.5px; color: #7a828c; margin-top: 10px; min-height: 18px; transition: opacity .3s; }
  </style>

    <div class="boot-card">
      <div class="boot-logo">🎖️</div>
      <div class="boot-title">26 考研全能作战系统</div>
      <div class="boot-track"><div class="boot-bar" id="boot-bar"></div></div>
