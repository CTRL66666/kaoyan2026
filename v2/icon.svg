<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="buchii 鸦荔考研">
  <!-- 站点品牌图标：乌鸦立于摊开的书上，头顶一颗荔枝（绿叶短梗），蓝底。
       与 tools/pdf-guide/assets/logo-lychee-full.png 同设计，矢量化供 favicon / 启动屏 / 站内引用。 -->
  <circle cx="256" cy="256" r="256" fill="#4B91FA"/>
  <!-- 摊开的书：白色书页 + 深蓝左封 / 棕右封 + 中央书脊 -->
  <path d="M104 376 L256 356 L408 376 L408 398 L256 378 L104 398 Z" fill="#FFFFFF"/>
  <path d="M104 398 L256 378 L256 400 L104 420 Z" fill="#0B1C2C"/>
  <path d="M256 378 L408 398 L408 420 L256 400 Z" fill="#8E4626"/>
  <rect x="251" y="356" width="10" height="44" fill="#8E4626"/>
  <!-- 腿 -->
  <rect x="230" y="344" width="9" height="34" rx="3" fill="#8E4626"/>
  <rect x="262" y="344" width="9" height="34" rx="3" fill="#8E4626"/>
  <!-- 乌鸦身体（面向左） -->
  <path d="M256 150 C322 150 366 202 366 268 C366 300 386 330 404 350 L250 350 C196 350 158 318 150 262 C143 212 190 150 256 150 Z" fill="#0B1C2C"/>
  <!-- 白色肚皮（左下月牙） -->
  <path d="M151 296 C160 334 200 350 238 350 C206 338 180 314 172 280 C162 284 154 289 151 296 Z" fill="#FFFFFF"/>
  <!-- 白喙 -->
  <path d="M158 206 L110 224 L158 244 Z" fill="#FFFFFF"/>
  <!-- 白眼（上半圆） -->
  <path d="M196 208 A14 14 0 0 1 224 208 Z" fill="#FFFFFF"/>
  <!-- 头顶荔枝：短梗 + 两片绿叶 + 红果身 + 深色凸点 -->
  <rect x="253" y="86" width="6" height="16" rx="3" fill="#6B4423"/>
  <path d="M256 92 C244 78 226 76 216 84 C226 96 244 98 256 92 Z" fill="#43A047"/>
  <path d="M256 92 C268 78 286 76 296 84 C286 96 268 98 256 92 Z" fill="#2E7D32"/>
  <circle cx="256" cy="122" r="40" fill="#C0392B"/>
  <g fill="#96281B">
    <circle cx="244" cy="112" r="4"/><circle cx="262" cy="108" r="4"/><circle cx="274" cy="120" r="4"/>
    <circle cx="250" cy="128" r="4"/><circle cx="266" cy="134" r="4"/><circle cx="238" cy="126" r="3.5"/>
    <circle cx="256" cy="144" r="3.5"/><circle cx="276" cy="136" r="3.5"/>
  </g>
</svg>
